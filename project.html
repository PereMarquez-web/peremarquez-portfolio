<script type="module">
  import { mountHeader } from "/src/js/header.js";

  mountHeader({ brandHref: "/#home" });

  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.site-header a[data-nav="1"], .mobile-drawer a[data-nav="1"]').forEach(a => {
