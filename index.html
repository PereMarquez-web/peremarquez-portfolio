<body>
  <main>

            <div id="chip-webdesign" class="chip chip--role" style="left:220px; top:610px;">Web Design</div>
            <div id="chip-creative" class="chip chip--role" style="left:120px; top:785px;">Creative direction</div>

        <h1 class="hero-title">Pere Márquez</h1>
        <a class="hero-cta" href="#projects">

        </a>

    </section>

    <section id="projects" style="min-height:100vh;"></section>
    <section id="experience" style="min-height:100vh;"></section>
    <section id="about" style="min-height:100vh;"></section>
    <section id="contact" style="min-height:70vh;"></section>
  </main>

  <script type="module">
    import { mountHeader } from "/src/js/header.js";
    import { mountFooter } from "/src/js/footer.js";
    mountHeader({ brandHref: "#home" });
    mountFooter();
  </script>

  <script type="module" src="/src/js/hero.js"></script>
</body>
</html>
